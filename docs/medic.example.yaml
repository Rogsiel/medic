# yaml-language-server: $schema=https://raw.githubusercontent.com/Rogsiel/medic/main/schema/medic.schema.json
# medic config. Reference: https://github.com/Rogsiel/medic/blob/main/docs/config.md
version: 1

defaults:
  timeout: 5s

checks:
  # Local system
  cpu:
    type: cpu
    expect:
      usage: { warn: 80%, fail: 95% }
  memory:
    type: memory
    expect:
      used: { warn: 85%, fail: 95% }
  swap:
    type: swap
    expect:
      used: { warn: 50%, fail: 80% }
  disk-root:
    type: disk
    path: /
    expect:
      used: { warn: 85%, fail: 92% }
      free: { warn: 10GiB, fail: 2GiB }
  load:
    type: load
    window: 5m
    expect:
      per_cpu: { warn: 100%, fail: 200% }

