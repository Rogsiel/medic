[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "medic"
version = "0.1.0"
description = "Health-check CLI for pipeline checkpoints, CI, and watch-mode monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ali" }
]
keywords = ["healthcheck", "monitoring", "cli", "ci", "devops", "diagnostics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "rich>=12.0.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "cryptography>=38.0.0",
    "argcomplete>=3.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.5.0",
    "types-requests",
    "types-psutil",
    "build",
]

[project.urls]
Homepage = "https://github.com/Rogsiel/medic"
Issues = "https://github.com/Rogsiel/medic/issues"

[project.scripts]
medic = "medic.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["medic*"]

[tool.setuptools.package-data]
medic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",   # long message strings; no auto-formatter enforced
    "UP006",  # keep typing.List/Dict style used across the codebase
    "UP007",
    "UP035",
    "UP045",
    "B008",
]

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true
