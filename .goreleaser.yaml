# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: medic

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: ./cmd/medic
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  # Version-less names so releases/latest/download/<name> always works (install.sh, Action).
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

dockers_v2:
  - images: [ghcr.io/rogsiel/medic]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/Rogsiel/medic
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: MIT

changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
